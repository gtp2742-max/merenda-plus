<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Vizualização do estoque</h1>

     <title>Sistema Merenda Escolar</title>
</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="card shadow p-4">

    
      <h4 class="text-center mb-4">
        Sistema Merenda Escolar
      </h4>
      
      <div class="row justify-content-center mb-4">
    
    <div class="col-md-6">

   
    
     <input type="text"
                 class="form-control"
                 placeholder="Pesquisar produto">
    </div>
    
    <div class="col-md-2">
          <button class="btn btn-primary w-100">
            Buscar
              </button>
        </div>
       
    </div>    


     <h5 class="mb-3">Estoque acabando</h5>

    <table class="table table-bordered">
    
      <tbody>      
        
        <tr>
            <td>Arroz</td>
            <td>2kg</td>
        </tr>

        <tr>
            <td>Feijão vermelho</td>
            <td>1kg</td>
        </tr>

        <tr>
            <td>Óleo de Soja</td>
            <td>1L</td>
        </tr>
      </tbody>
    </table>
    
     <h5 class="mt-4 mb-3">Validade próxima</h5>
    
     <table class="tabl table-bordered"></table>
  
    <tbody>
   
     <tr>

       <td>Biscoito de Sal</td>
       <td>Vence em 7 dias</td>
  
     </tr> 
      <button id="mostrar" class="btn-secundary">
        Mostrar mais
        </button>
     <td id="restante">...</td>
    
     </tbody>
    
    <h5 class="mt-4 mb-3">Estoque</h5>

    <table class="table ">

      <tbody>

        <tr>

         <td>Macarrão Espagueti</td>
         <td>12kg</td>




        </tr>

        <tr>
       
           <td>Farinha de trigo</td>
       
           <td>10kg</td>
       
        </tr>
       

      </div> 
       </tbody>

    </table>


    <div id= "voltar" class="mt-4">
      
      <button class="btn-secundary">
        Voltar
      </button>

    </div> 

    
      
   
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
