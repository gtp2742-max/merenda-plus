<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque | Merenda+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/navbar_D.css">
    <link rel="stylesheet" href="../../assets/css/estoque_D.css">
</head>
<body class="d-flex justify-content-center">
    <nav class="navbar-merenda">
        <a href="home_D.html" class="nav-brand">Merenda<span>+</span></a>
        <div class="nav-links">
            <a href="relatorios_D.html">Relatórios</a>
            <a href="estoque_D.html">Estoque</a>
            <a href="cardapio_D.html">Cardápio</a>
            <a href="reportes_D.html">Reportes</a>
            <a href="alertas_D.html">Alertas</a>
        </div>
        <div class="nav-actions">
            <a href="perfil_D.html" class="btn-perfil ativo">
                <i class="bi bi-person-circle"></i> Perfil
            </a>
            <button class="btn-sair" onclick="sair()">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </div>
    </nav>

    <div class="container mt-4 mb-4">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Sistema Merenda +
            </h2>

            <!-- Pesquisa -->
            <div class="row justify-content-center mb-4">

                <div class="col-md-6">
                    <input
                        id="pesquisa"
                        type="text"
                        class="form-control"
                        placeholder="Pesquisar alimento">
                </div>

                <div class="col-md-3">
                    <button id="buscar" class="btn btn-success w-100">
                        Buscar
                    </button>
                </div>

            </div>

            <!-- Visão Geral -->
            <h3 class="mb-3">Visão Geral</h3>

            <div class="row g-3">

                <div class="col-md-4">
                    <div class="card shadow p-3 text-center">
                        <h6>Total de Produtos</h6>

                        <h4 id="total-produtos">0</h4>

                        <button id="mostrar_total" class="btn btn-success mt-2">
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow p-3 text-center">
                        <h6>Produtos em Baixo Estoque</h6>

                        <h4 id="baixo-estoque">0</h4>

                        <button id="mostrar_baixo_estoque" class="btn btn-success mt-2">
                            Mostrar
                        </button>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow p-3 text-center">
                        <h6>Próximos de Vencer</h6>

                        <h4 id="proximos-vencer">0</h4>

                        <button id="mostrar_vencimento" class="btn btn-success mt-2">
                            Mostrar
                        </button>
                    </div>
                </div>

            </div>

            <!-- Estoque -->
   <!-- Estoque -->
<h3 class="mt-4 mb-3">Estoque</h3>

<div class="table-responsive">

    <table class="table table-warning table-hover table-bordered">

        <thead class="table-primary">
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Validade</th>
                <th width="80">Ações</th>
            </tr>
        </thead>

        <tbody id="tabela-estoque">
        </tbody>

    </table>

</div>

            <!-- Adicionar alimento -->
            <div class="card p-3 mt-4">

                <h5 class="mb-3">Adicionar Alimento</h5>

                <input
                    type="text"
                    id="nomeAlimento"
                    class="form-control mb-2"
                    placeholder="Nome do alimento">

                <input
                    type="number"
                    id="quantidadeAlimento"
                    class="form-control mb-2"
                    placeholder="Quantidade">

                <input
                    type="text"
                    id="unidadeAlimento"
                    class="form-control mb-2"
                    placeholder="Unidade (kg, L, un)">

                <input
                    type="date"
                    id="validadeAlimento"
                    class="form-control mb-3">

                <button
                    id="btnAdicionarAlimento"
                    class="btn btn-success">
                    Adicionar
                </button>

            </div>

            <!-- Produtos próximos da validade -->
            <h4 class="mt-5 mb-3">Validade Próxima</h4>

            <div class="table-responsive">

                <table class="table table-warning table-hover table-bordered">

                    <tbody id="tabela-validade">
                    </tbody>

                </table>

            </div>

            <button id="mostrar" class="btn btn-success w-100 mt-3">
                Mostrar
            </button>

        </div>

    </div>

    <script src="../../assets/js/estoque_D.js"></script>
    <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
        function voltar() { window.history.back(); }
    </script>
</body>
</html>
