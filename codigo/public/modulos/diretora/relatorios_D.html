<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../../assets/css/navbar_D.css">
    <link rel="stylesheet" href="../../assets/css/relatorios_D.css">
</head>

<body>
    <nav class="navbar-merenda">
        <a href="home_D.html" class="nav-brand">Merenda<span>+</span></a>
        <div class="nav-links">
            <a href="relatorios_D.html">Relatórios</a>
            <a href="estoque_D.html">Estoque</a>
            <a href="cardapio_D.html">Cardápio</a>
            <a href="reportes_D.html">Reportes</a>
            <a href="alertas_D.html">Alertas</a>
        </div>
        <div class="nav-actions">
            <a href="perfil_D.html" class="btn-perfil ativo">
                <i class="bi bi-person-circle"></i> Perfil
            </a>
            <button class="btn-sair" onclick="sair()">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </div>
    </nav>
    
    <header class="text-center mt-4">
        <h1>Sistema Merenda +</h1>
    </header>

    <div class="container mt-5 card-relatorio text-center">
        <h3 class="">Periodo de Análises</h3>

        <div class="row g-3 mb-4 mt-4 justify-content-center">

            <div class="col-md-4">
                <select id="mes_filtro" class="form-control">
                    <option value="">Selecione um mês</option>
                    <option value="1">Janeiro</option>
                    <option value="2">Fevereiro</option>
                    <option value="3">Março</option>
                    <option value="4">Abril</option>
                    <option value="5">Maio</option>
                </select>
            </div>

            <div class="col-md-4">
                <button id="filtro" class="btn btn-success w-100">Aplicar Filtro</button>
            </div>
        </div>

    </div>

    <div class="container mt-5">
        <div class="row g-3">

            <div class="col-md-4">
                <h4 class = "text-center mb-2">🍽️ Total de Refeiçoes Servidas</h4>
                <div id="total_refeicoes" class="indicador border rounded p-3 text-center">
             </div>
            </div>

            <div class="col-md-4">
                <h4 class = "text-center mb-2">♻️ Porcentagem de Desperdício</h4>
                <div id="porcentagem_desp" class="indicador border rounded p-3 text-center">
                </div>
            </div>

            <div class=" col-md-4">
                <h4 class = "text-center mb-2">✅ Cardápio Cumprido</h4>
                <div id="porcentagem_cardapio" class="indicador border rounded p-3 text-center">
                </div>
            </div>

        </div>
    </div>

    <div class="container mt-5">
        <h3 class="text-center">Desperdicio por semana (kg)</h3>

        <div class=" grafico-card border rounded p-4 me-3">
            <canvas id="grafico"></canvas>
        </div>

        <div id="observacao" class="mt-4"></div>

        <div class="d-flex justify-content-between mt-4">
            <button id="pdf" class="btn btn-success">Exportar PDF</button>

            <button id="exportar" class="btn btn-success">Exportar Dados</button>
        </div>
    </div>

    <script src="../../assets/js/relatorios_D.js"></script>
    <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
    </script>
</body>

</html>
