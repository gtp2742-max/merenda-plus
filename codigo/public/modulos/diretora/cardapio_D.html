<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cardápio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/cardapio.css">
</head>

<body>

    <header class="cardapio-header">
        <h1>Sistema Merenda +</h1>
        <h3>Cadastro de Cardápio Semanal</h3>
    </header>

    <div class="container mt-4 cardapio-formulario">

        <h4 class="text-center mb-4">Novo Cardápio</h4>

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Data</label>
                <input type="date" id="data" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Refeição</label>
                <select id="refeicao" class="form-control">
                    <option>Café da Manhã</option>
                    <option>Almoço</option>
                    <option>Lanche</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Quantidade Prevista</label>
                <input type="number" id="quantidade" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Prato Principal</label>
                <input type="text" id="pratoPrincipal" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Acompanhamento</label>
                <input type="text" id="acompanhamento" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Sobremesa</label>
                <input type="text" id="sobremesa" class="form-control">
            </div>

            <div class="col-md-12">
                <label class="form-label">Observação</label>
                <textarea id="observacao" class="form-control" rows="3"></textarea>
            </div>

            <div class="col-md-12 text-center">
                <button id="salvar" class="btn cardapio-btn-salvar text-white px-5">
                    Salvar Cardápio
                </button>
            </div>

        </div>

    </div>

    <div class="container mt-5">

        <h3 class="text-center mb-4">
            Cardápios Planejados
        </h3>

        <table class="table cardapio-tabela">

            <thead>
                <tr>
                    <th>Data</th>
                    <th>Refeição</th>
                    <th>Prato Principal</th>
                    <th>Sobremesa</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaCardapios">
            </tbody>

        </table>

    </div>

    <div class="container mt-4">
        <button id="voltar" class="btn btn-secondary">
            Voltar
        </button>
    </div>

    <script src="../../assets/js/cardapio_D.js"></script>

</body>

</html>
