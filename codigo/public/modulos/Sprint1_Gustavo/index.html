<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Preparo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="script.js"></script>
</head>

<body>

    <h1 class="text-center">Sistema de Merenda Escolar</h1>

    <div class="container border border-primary rounded-4">

        <h2 class="mt-3 ms-2 text-center">Dados do Preparo</h2>

        <div class="container-fluid">
            <h4 class="ms-3">Data e Refeição</h3>

                <div class="row d-flex gap-5 ms-5 text-center">
                    <div class="card w-10 col-3 rounded-3">
                        <p id="dataPreparo"></p>
                    </div>
                    <div class="card w-10 col-3 rounded-3">
                        <p id="refeicao"></p>
                    </div>
                </div>
        </div>

        <div class="container-fluid">
            <h4 class="ms-3">Prato Preparado</h4>

            <div class="row d-flex gap-5 ms-5 text-center rounded-3">
                <div class="card w-5 col-5">
                    <p id="prato"></p>
                </div>
            </div>

            <div class="container-fluid">
                <div class="col-12">
                    <h4 class="ms-3">Alimentos Preparados</h4>

                    <div class="card p-3">

                        <div id="listaAlimentos"></div>

                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-4">
            <input type="text" placeholder="Nome do Alimento" id="nomeAlimento">
            </div>

                <div class="col-4">
            <input type="text" placeholder="Quantidade" id="quantidadeAlimento">
            </div>

<div class="text-center mb-3">
    <button id="btnAdicionar">
        Adicionar alimento
    </button>
</div>


    </div>
</body>

</html>
