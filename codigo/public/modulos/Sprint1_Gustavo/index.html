<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Preparo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="script.js"></script>
</head>

<body>

    <h1 class="text-center">Sistema de Merenda Escolar</h1>

    <div class="container border border-black rounded-4 p-4 mt-4 w-75">

        <h2 class="mt-3 ms-2 text-center">Dados do Preparo</h2>

        <div class="container-fluid">
            <h4 class="ms-3" >Data e Refeição</h4>

            <div class="row d-flex gap-5 ms-5 text-center">
                <div class="card col-4 p-2 rounded-3">
                    <p id="dataPreparo"></p>
                </div>
                <div class="card w-10 col-3 rounded-3">
                    <p id="refeicao"></p>
                </div>
            </div>
        </div>

        <div class="container-fluid">
            <h4 class="ms-3">Prato Preparado</h4>

            <div class="row d-flex gap-5 ms-5 text-center rounded-3">
                <div class="card col-6 p-2 text-center">
                    <p id="prato"></p>
                </div>
            </div>

            <div class="container-fluid">
                <div class="col-12">
                    <h4 class="ms-3">Alimentos Preparados</h4>
                    <div class="card p-3">

                        <div class="row border-bottom py-2">

                            <div class="col-6">
                                Alimento
                            </div>

                            <div class="col-6 text-center">
                                Qtd(kg)
                            </div>

                        </div>

                        <div id="listaAlimentos"></div>

                    </div>
                </div>
            </div>

            <div class="text-center mt-3">

                <button id="btnMostrar" class= "btn btn-outline-dark">Adicionar Alimento</button>
            </div>

            <div id="areaAdicionar" style="display: none">

                <div class="row mb-3">
                    <div class="col-4 align-items-center">
                        <input type="text" class="form-control" placeholder="Nome do Alimento" id="nomeAlimento">
                    </div>

                    <div class="col-4">
                        <input type="text" class="form-control" placeholder="Quantidade" id="quantidadeAlimento">
                    </div>

                    <div class="text-center mt-3">

                        <button id="btnAdicionar" class="btn btn-success">Confirmar</button>
                    </div>
                </div>
            </div>
            



            <div class="mt-4">

                <h5>Observações</h5>

                <textarea id="observacoes" class="form-control w-50" rows="2" placeholder="Substituiu óleo por azeite">
                </textarea>

            </div>
            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-secondary">Voltar</button>

                <button id="btnSalvar" class="btn btn-success"> Salvar preparo</button>
            </div>

        </div>
    </div>
</body>

</html>
