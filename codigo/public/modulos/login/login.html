<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merenda+ | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body>
  <div class="login-card">
    <div class="login-logo">
      <h1>Merenda Plus</h1>
      <p>Sistema de Gestão de Merenda Escolar</p>
    </div>
    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Login</label>
        <input type="text" id="username" class="form-control" placeholder="Digite seu login" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
      </div>
      <div class="form-check">
        <label class="form-label">Perfil de acesso</label>
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="opcao" value="diretora" id="btndiretora" required>
            <label class="role-label" for="btndiretora">
              Diretora
            </label>
          </div>
          <div class="role-option">
            <input value="merendeira" type="radio" name="opcao" id="btnmerendeira">
            <label class="role-label" for="btnmerendeira">
              Merendeira
            </label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-entrar">
        Entrar
      </button>
    </form>
    <div class="divider">ou</div>
    <div class="text-center">
      <button class="btn-registrar-link" data-bs-toggle="modal" data-bs-target="#modalRegistrar">
        Criar nova conta
      </button>
    </div>     
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalRegistrar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nova Conta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label">Usuário</label><br>
            <input type="text" id="txt_login" class="form-control" placeholder="Nome do usuário">
          </div>
          <div class="mb-3">
            <label class="form-label">Nome completo</label>
            <input type="text" id="txt_nome" class="form-control" placeholder="Seu nome completo">
          </div>
          <div class="mb-3">
            <label class="form-label">email</label>
            <input type="email" id="txt_email" class="form-control" placeholder="seu@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" id="txt_senha" class="form-control" placeholder="Crie uma senha">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar Senha</label>
            <input type="password" id="txt_senha2" class="form-control" placeholder="Repita a senha">
          </div>
          <div class="mb-1">
            <label class="form-label">Perfil</label>
            <div class="role-selector">
              <div class="role-option">
                <input type="radio" name="opcao_reg" value="diretora" id="reg_diretora">
                <label class="role-label" for="reg_diretora">
                  Diretora
                </label>
              </div>
              <div class="role-option">
                <input value="merendeira" type="radio" name="opcao_reg" id="reg_merendeira">
                <label class="role-label" for="reg_merendeira">
                  Merendeira
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn_salvar" class="btn btn-success">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/login.js"></script>
  <script>

    // Declara uma função para processar o formulário de login
    function processaFormLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados de login e senha a partir do formulário de login
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var opcaoSelecionada = document.querySelector('input[name="opcao"]:checked');
      // Valida login e se estiver ok, redireciona para tela inicial da aplicação
      if (!opcaoSelecionada) {
        alert('Selecione se você é Diretora ou Merendeira.')
        return
      }
      
      var role = opcaoSelecionada.value;
      var roleSalvo = loginUser(username, password, role);
      
      if(roleSalvo){
        // Redireciona para o home correto com base no role
        if(roleSalvo === 'diretora'){
          window.location.href = HOME_DIRETORA_URL;
        } else if (roleSalvo === 'merendeira') {
          window.location.href = HOME_MERENDEIRA_URL;
        } else {
          window.location.href = RETURN_URL; // fallback genérico
        }
      } else {
        alert('Usuário ou senha incorretos, ou conta inativa.');
      }
    }

    function salvaLogin(event) {
      // Cancela a submissão do formulário para tratar sem fazer refresh da tela
      event.preventDefault();

      // Obtem os dados do formulário
      let login = document.getElementById('txt_login').value;
      let nome = document.getElementById('txt_nome').value;
      let email = document.getElementById('txt_email').value;
      let senha = document.getElementById('txt_senha').value;
      let senha2 = document.getElementById('txt_senha2').value;
      let opcaoReg = document.querySelector('input[name="opcao_reg"]:checked');
      if(!opcaoReg){
        alert('Selecione um perfil');
        return
      }
      let role = opcaoReg.value;
      if (senha != senha2) {
        alert('As senhas informadas não conferem.');
        return
      }
      // Adiciona o usuário no banco de dados
      addUser(nome, login, senha, email,role,'pendente');
      alert('Conta criada! Aguarde aprovação da diretora para acessar o sistema.');
      bootstrap.Modal.getInstance(document.getElementById('modalRegistrar')).hide();
    }

    // Associa a funçao processaFormLogin  formulário adicionado um manipulador do evento submit
    document.getElementById('login-form').addEventListener('submit', processaFormLogin);
    // Associar salvamento ao botao
    document.getElementById('btn_salvar').addEventListener('click', salvaLogin);        
  </script>

  </body>

</html>
