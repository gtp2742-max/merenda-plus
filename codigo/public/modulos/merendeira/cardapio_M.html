<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio da Semana</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/cardapio.css">
</head>

<body>
 
    <div class="container-principal">
 
        <h1 class="titulo-sistema">Sistema Merenda +</h1>

        <div class="card-principal">
 
            <h2 class="titulo-pagina">Cardápios Disponíveis</h2>
 
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Refeição</th>
                            <th>Prato Principal</th>
                            <th>Acompanhamento</th>
                            <th>Sobremesa</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaCardapios">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
 
        </div>
        <div class="card-principal">
 
            <p class="secao-titulo">Registrar Alteração no Cardápio</p>
 
            <div id="avisoSelecao" class="aviso">
                ⚠️ Selecione um cardápio na tabela acima clicando em <strong>Alterar</strong>.
            </div>
 
            <input type="hidden" id="idCardapio">
 
            <div class="mb-3">
                <label class="label-titulo" for="observacaoMerendeira">
                    Descreva a alteração realizada
                </label>
                <textarea id="observacaoMerendeira" class="form-control" rows="4"
                    placeholder="Ex: Substituído o frango por carne moída devido à falta no estoque."></textarea>
            </div>
 
            <button id="registrarAlteracao" class="btn-salvar" disabled>
                Registrar Alteração
            </button>
 
        </div>
    <div class="rodape-voltar">
        <button class="btn-voltar-padrao" onclick="voltar()">
            Voltar
        </button>
    </div>

    <script src="../../assets/js/cardapio_M.js"></script>

</body>

</html>
