<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio da Semana | Merenda+</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/navbar_M.css">
    <link rel="stylesheet" href="../../assets/css/cardapio.css">
</head>

<body>
 
    <div class="container-principal">
        <nav class="navbar-merenda-m">
            <a href="home_M.html" class="nav-brand">Merenda<span>+</span></a>
            <div class="nav-links">
                <a href="cardapio_M.html">Cardápio</a>
                <a href="preparo_M.html">Preparo</a>
                <a href="registrar_consumo_M.html">Consumo</a>
                <a href="estoque_M.html">Estoque</a>
                <a href="reportar_problema_M.html">Reportar</a>
            </div>
            <div class="nav-actions">
                <a href="perfil_M.html" class="btn-perfil">
                    <i class="bi bi-person-circle"></i> Perfil
                </a>
                <button class="btn-sair" onclick="sair()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </nav>
 
        <h1 class="titulo-sistema">Sistema Merenda +</h1>

        <div class="card-principal">
 
            <h2 class="titulo-pagina">Cardápios Disponíveis</h2>
 
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Refeição</th>
                            <th>Prato Principal</th>
                            <th>Acompanhamento</th>
                            <th>Sobremesa</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaCardapios">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
 
        </div>
        <div class="card-principal">
 
            <p class="secao-titulo">Registrar Alteração no Cardápio</p>
 
            <div id="avisoSelecao" class="aviso">
                ⚠️ Selecione um cardápio na tabela acima clicando em <strong>Alterar</strong>.
            </div>
 
            <input type="hidden" id="idCardapio">
 
            <div class="mb-3">
                <label class="label-titulo" for="observacaoMerendeira">
                    Descreva a alteração realizada
                </label>
                <textarea id="observacaoMerendeira" class="form-control" rows="4"
                    placeholder="Ex: Substituído o frango por carne moída devido à falta no estoque."></textarea>
            </div>
 
            <button id="registrarAlteracao" class="btn-salvar" disabled>
                Registrar Alteração
            </button>
 
        </div>
   
    <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
    </script>

    <script src="../../assets/js/cardapio_M.js"></script>

</body>

</html>
