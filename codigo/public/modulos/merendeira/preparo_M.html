<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Preparo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/navbar_M.css">
    <link rel="stylesheet" href="../../assets/css/preparo_M.css">
</head>

<body>

    <div class="container-principal">
     <nav class="navbar-merenda-m">
      <a href="home_M.html" class="nav-brand">Merenda<span>+</span></a>
      <div class="nav-links">
        <a href="cardapio_M.html">Cardápio</a>
        <a href="preparo_M.html">Preparo</a>
        <a href="registrar_consumo_M.html">Consumo</a>
        <a href="estoque_M.html">Estoque</a>
        <a href="reportar_problema_M.html">Reportar</a>
      </div>
      <div class="nav-actions">
        <a href="perfil_M.html" class="btn-perfil">
          <i class="bi bi-person-circle"></i> Perfil
        </a>
        <button class="btn-sair" onclick="sair()">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
     </nav>

        <h1 class="titulo-sistema">Sistema Merenda +</h1>

        <div class="card-principal">

            <h2 class="titulo-pagina">Dados do Preparo</h2>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="label-titulo">Data</label>

                    <div class="campo-info">
                        <p id="dataPreparo"></p>
                    </div>
                </div>




                <div class="col-md-6">
                    <label class="label-titulo">Refeição</label>

                    <div class="campo-info">
                        <p id="refeicao"></p>
                    </div>
                </div>

            </div>

            <div class="mt-4">

                <label class="label-titulo">Prato Preparado</label>

                <div class="campo-info">
                    <p id="prato"></p>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
                <h4 class="m-0">Alimentos Preparados</h4>

                <button id="btnMostrar" class="btn btn-success">
                    + Adicionar
                </button>

            </div>


            <div class="tabela-alimentos">

                <div class="linha-topo">

                    <span>Alimento</span>

                    <span>Quantidade</span>

                    <span>Ações</span>

                </div>

                <div id="listaAlimentos"></div>

            </div>


            <div id="areaAdicionar" class="area-add container mt-4" style="display: none;">

                <div class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="Nome do alimento" id="nomeAlimento">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Quantidade" id="quantidadeAlimento">
                    </div>
                    <div class="col-md-3">
                        <button id="btnAdicionar" class="btn btn-success w-100">
                            Confirmar
                        </button>
                    </div>

                </div>

            </div>

            <div id="areaEditar" class="area-add container mt-4" style="display: none;">

                <div class="row g-3">

                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="Nome do alimento" id="editarNome">
                    </div>

                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Quantidade" id="editarQuantidade">
                    </div>

                    <div class="col-md-3">
                        <button id="btnConfirmarEdicao" class="btn btn-warning w-100">

                            Salvar edição

                        </button>
                    </div>

                </div>

            </div>

            <div class="mt-4">

                <label class="label-titulo">Observações</label>

                <textarea id="observacoes" class="form-control w-50" rows="3"
                    placeholder="Digite observacoes do preparo">
                </textarea>

            </div>
        </div>

    </div>

    <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
    </script>

    <script src="../../assets/js/preparo_M.js"></script>
</body>

</html>
