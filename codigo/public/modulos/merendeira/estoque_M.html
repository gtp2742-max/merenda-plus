<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque | Merenda+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/navbar_M.css">
  <link rel="stylesheet" href="../../assets/css/estoque_M.css">
</head>

<body class="style d-flex justify-content-center">

  <div class="container mt-4">
    <nav class="navbar-merenda-m">
      <a href="home_M.html" class="nav-brand">Merenda<span>+</span></a>
      <div class="nav-links">
        <a href="cardapio_M.html">Cardápio</a>
        <a href="preparo_M.html">Preparo</a>
        <a href="registrar_consumo_M.html">Consumo</a>
        <a href="estoque_M.html">Estoque</a>
        <a href="reportar_problema_M.html">Reportar</a>
      </div>
      <div class="nav-actions">
        <a href="perfil_M.html" class="btn-perfil">
          <i class="bi bi-person-circle"></i> Perfil
        </a>
        <button class="btn-sair" onclick="sair()">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
    </nav>
    

  <h1 class="titulo-sistema text-center">Sistema Merenda +</h1>

    <div class="card shadow p-5 ">


      <h3 class="text-center mb-5 ">
        Estoque
      </h3>

      <div class="row justify-content-center mb-4">

        <div class="col-md-6 ">



          <input id="pesquisa" type="text" class="form-control m-10px " placeholder="Pesquisar produto">
        </div>

        <div class="col-md-3 bg-green">
          <button id="buscar" class="btn btn-success w-100">
            Buscar
          </button>
        </div>

      </div>


      <h2 class="mt-4 mb-3">Estoque</h2>

      <div class="table-responsive">

        <table class="table table-warning table-hover table-bordered">

          <thead class="table-primary w-50 text-start">
            <tr>
              <th>Produto</th>
              <th class="text-center">Quantidade</th>
              <th>Validade</th>
            </tr>
          </thead>




        </table>

      </div>

      <table class="table table-responsive table-hover table-bordered text-center">

        <tbody id="tabela-estoque"></tbody>

      </table>
      <div class="card p-3 mb-4">

        <h5>Adicionar Alimento</h5>

        <input type="text" id="nomeAlimento" class="form-control mb-2" placeholder="Nome do alimento">

        <input type="number" id="quantidadeAlimento" class="form-control mb-2" placeholder="Quantidade">

        <input type="text" id="unidadeAlimento" class="form-control mb-2" placeholder="Unidade (kg, L, un)">

        <input type="date" id="validadeAlimento" class="form-control mb-3">

        <button id="btnAdicionarAlimento" class="btn btn-success">
          Adicionar
        </button>

      </div>

      <h5 class="mt-5 mb-3">Validade próxima</h5>

      <div class=" table-responsive table-hover">

        <table class="table table-warning table-hover table-bordered">

          <tbody id="tabela-validade"></tbody>

        </table>
      </div>

      <button id="mostrar" class=" btn btn-primary w-100">
        Mostrar
      </button>

      <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
      </script>


      <script src="../../assets/js/estoque_M.js" defer></script>

</body>

</html>
