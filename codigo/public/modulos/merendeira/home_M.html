<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Merendeira</title>
    <link rel="stylesheet" href="../../assets/css/home_M.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/navbar_M.css">
    <link rel="stylesheet" href="../../assets/css/home_M.css">
</head>

<body>

    <div class="container-principal">
        <nav class="navbar-merenda-m">
            <a href="home_M.html" class="nav-brand">Merenda<span>+</span></a>
            <div class="nav-links">
                <a href="cardapio_M.html">Cardápio</a>
                <a href="preparo_M.html">Preparo</a>
                <a href="registrar_consumo_M.html">Consumo</a>
                <a href="estoque_M.html">Estoque</a>
                <a href="reportar_problema_M.html">Reportar</a>
            </div>
            <div class="nav-actions">
                <a href="perfil_M.html" class="btn-perfil">
                    <i class="bi bi-person-circle"></i> Perfil
                </a>
                <button class="btn-sair" onclick="sair()">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </nav>

        <h1 class="titulo-sistema">Sistema Merenda +</h1>

        <div class="card-principal">

            <h2 class="titulo-pagina">Painel da Merendeira</h2>
            <p class="saudacao" id="saudacao">Carregando...</p>

            <div class="grid-metricas" id="grid-metricas">
                <div class="estado-loading" style="grid-column: 1/-1;">Carregando dados...</div>
            </div>

            <p class="secao-titulo">Cardápio de Hoje</p>

            <div id="cardapio-container">
                <div class="estado-loading">Carregando cardápio...</div>
            </div>

            <p class="secao-titulo">Acesso Rápido</p>

            <div class="grid-acessos">

                <a href="cardapio_M.html" class="btn-acesso">
                    <span class="icone">📅</span>
                    <span>Ver Cardápio Completo</span>
                </a>

                <a href="../merendeira/preparo_M.html" class="btn-acesso">
                    <span class="icone">🍳</span>
                    <span>Registrar Preparo</span>
                </a>

                <a href="../merendeira/registrar_consumo_M.html" class="btn-acesso">
                    <span class="icone">🍽️</span>
                    <span>Registrar Consumo</span>
                </a>

                <a href="../merendeira/estoque_M.html" class="btn-acesso">
                    <span class="icone">📦</span>
                    <span>Consultar Estoque</span>
                </a>

            </div>

            <div class="grid-acessos-full">
                <a href="../merendeira/reportar_problema_M.html" class="btn-acesso destaque">
                    <span class="icone">⚠️</span>
                    <span>Reportar Problema</span>
                </a>
            </div>

        </div>

    </div>
    <script>
        function sair() {
            sessionStorage.removeItem('usuarioCorrente');
            window.location.href = '/modulos/login/login.html';
        }
    </script>

    <script src="../../assets/js/home_M.js"></script>
</body>

</html>
