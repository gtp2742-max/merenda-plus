<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Merendeira</title>
    <link rel="stylesheet" href="../../assets/css/home_M.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="../../assets/js/home_M.js"></script>

</head>

<body class="p-5">
    <h1 class="titulo-home">Sistema Merenda +</h1>
    <main class="card-home" id="principal">
        <section>
            <h2 class="titulo-pagina text-center">Home Merendeira</h2>
            <div class="d-flex justify-content-between mb-2" id="ola">

            </div>
            <div class="info-card" id="porcoes">

            </div>
            <div class="cardapio-box">
                <h4>Cardápio de Hoje:</h4>
                <ul id="cardapio">

                </ul>

            </div>
        </section>

        <h4 class="menu-title">Acesso Rápido</h4>

        <article class="row g-3 mt-2">

            <div class="col-md-6">
                <a href="cardapio_M.html" class="btn btn-menu w-100">
                    Ver Cardápio Completo
                </a>
            </div>

            <div class="col-md-6">
                <a href="../merendeira/preparo_M.html" class="btn btn-menu w-100">
                    Registrar Preparo
                </a>
            </div>

            <div class="col-md-6">
                <a href="../merendeira/registrar_consumo_M.html" class="btn btn-menu w-100">
                    Registrar Consumo
                </a>
            </div>

            <div class="col-md-6">
                <a href="../merendeira/estoque_M.html" class="btn btn-menu w-100">
                    Consultar Estoque
                </a>
            </div>

            <div class="col-md-12">
                <a href="../merendeira/reportar_problema_M.html" class="btn btn-menu w-100">
                    Reportar Problema
                </a>
            </div>

        </article>
    </main>

    <form action="" id="formPorcoes" class="form-card d-none">
        <H1>Editar porções:</H1>
        <p>Número de porções:</p>
        <input type="number" id="inputPorcoes"><br>
        <button id="salvarPorcoes" class="btn btn-salvar rounded-pill mt-4">Salvar Alteraçoes</button>
    </form>

    <form action="" id="formCardapio" class="form-card d-none">
        <h1>Editar cardápio:</h1>
        <p>Prato principal:</p>
        <input type="text" id="inputPrincipal">
        <p>Acompanhamento:</p>
        <input type="text" id="inputAcompanhamento">
        <p>Fruta:</p>
        <input type="text" id="inputFruta"><br>
        <button id="salvarCardapio" class="btn btn-salvar rounded-pill mt-4">Salvar Alteraçoes</button>
    </form>
    <div class="text-center mt-4">
        <button class="btn btn-secondary px-5">
            Voltar
        </button>
    </div>
</body>

</html>
