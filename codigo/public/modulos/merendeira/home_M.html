<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Merendeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="../../assets/js/home_M.js"></script>

</head>

<body class="p-5">
    <h1>Home Merendeira</h1>
    <main class="border border-black p-2" id="principal">
        <section>
            <h5 class="text-center">Sistema Merenda Escolar</h5>
            <div class="d-flex justify-content-between mb-2" id="ola">
                
            </div>
            <div class="border border-black mb-2" id="porcoes">
                
            </div>
            <div class="border border-black mb-2">
                <p>Cardápio de Hoje:</p>
                <ul id="cardapio">
                    
                </ul>
                <button class="primary"><a href="cardapio_M.html">ver cardapio</a></button>
            </div>
        </section>
        
        <h5>Menus:</h5>
        <article class="row g-3">

            <div class="col-6">
                <button class="btn btn-outline-dark w-100 py-1" id="editarPorcoes">Editar Porções</button>
            </div>

            <div class="col-6">
                <button class="btn btn-outline-dark w-100 py-1" id="editarCardapio">Editar Cardapio</button>
            </div>

            <div class="col-6">
                <a href="../merendeira/preparo_M.html" class="btn btn-outline-dark w-100 py-1">Registrar Preparo</a>
            </div>

            <div class="col-6">
                <a href="../merendeira/registrar_consumo_M.html" class="btn btn-outline-dark w-100 py-1">Registrar Consumo</a>
            </div>

            <div class="col-6">
                <a href="../merendeira/estoque_M.html" class="btn btn-outline-dark w-100 py-1">Ver Estoque</a>
            </div>

            <div class="col-6">
                <a href="../merendeira/reportar_problema_M.html" class="btn btn-outline-dark w-100 py-1">Reportar Problema</a>
            </div>

        </article>
    </main>

    <form action="" id="formPorcoes" class=" d-none border border-black p-2">
        <H1>Editar porções:</H1>
        <p>Número de porções:</p>
        <input type="number" id="inputPorcoes"><br>
        <button id="salvarPorcoes" class="btn btn-outline-dark rounded-pill mt-4">Salvar Alteraçoes</button>
    </form>

    <form action="" id="formCardapio" class=" d-none border border-black p-2">
        <H1>Editar cardápio:</H1>
        <p>Prato principal:</p>
        <input type="text" id="inputPrincipal">
        <p>Acompanhamento:</p>
        <input type="text" id="inputAcompanhamento">
        <p>Fruta:</p>
        <input type="text" id="inputFruta"><br>
        <button id="salvarCardapio" class="btn btn-outline-dark rounded-pill mt-4">Salvar Alteraçoes</button>
    </form>
</body>

</html>
