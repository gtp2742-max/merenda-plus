<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Consumo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="../../assets/js/registrar_consumo_M.js"></script>

</head>
<body class="p-5">
    <h1>Registrar consumo</h1>
    <main class="border border-black">
        
        <h5 class="text-center">Sistema Merenda Escolar</h5>
        <form action="" class="d-flex justify-content-around " id="form1">
            <div class="border border-black p-5">
                <p>Refeição do dia:</p>
                <input type="text" style="width:300px" id="refeicao_dia" required>
                <p>Porções previstas:</p>
                <input type="number" id="porcoes" required>
            </div>
            <div>
                <p>Data:</p>
                <input type="date" id="data" required>
                <p>Tipo da Refeição:</p>
                <input type="radio" name="tipo" checked value="Almoço">
                <label for="almoco">Almoço</label>

                <input type="radio" name="tipo" value="Jantar">
                <label for="jantar">Jantar</label>

            </div>
        </form>

        <h5 class="text-center">Lançamento de Consumo</h5>
        <form action="" class="text-center" id="form2">
            <p>Quantidade servida(porções):</p>
            <input type="number" class="text-center" id="qtdservida" required>
            <p>Sobras (porções):</p>
            <input type="number" class="text-center" id="sobras" required>
            <p>Desperdicio:</p>
            <input style="color: black; " type="number" id="desperdicio" class="text-center"  disabled> %  
            
        </form>

        <div class="d-flex justify-content-around">
            <button class="btn btn-outline-dark">Voltar</button>
            <button class="btn btn-outline-dark" id="btnEditar">Editar</button>
            <button class="d-none btn btn-outline-dark" id="btnAlterar">Alterar</button>
            <button class="d-none btn btn-outline-dark" id="btnDeletar">Deletar</button>
            <button class="btn btn-outline-dark" id="btnSalvar">Salvar Registros</button>
        </div>

    </main>

    <article id="consumos" class="d-none text-center container mt-4 p-3 bg-white border rounded shadow-sm">
        <table id="tabela" class="table">
            
        </table>
        
    </article>
</body>
</html>
