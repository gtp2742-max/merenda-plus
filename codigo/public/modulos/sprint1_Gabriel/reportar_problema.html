<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar Problema</title>
  <!-- Bootstap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="reportar_problema_M.css">
</head>

<body>
    <header></header>
    <main class="card-form">
        <h1 class="text-center mt-3 mb-4">Sistema Merenda Escolar</h1>
        <h4 class="mb-4">Reportar Problema</h4>

        <form id="formProblema" >

        <!-- Tipo de problema -->
        <label class="form-label mb-2 px-2">Tipo de Problema *</label>

        <div class="form-check card container px-5">
            <input class="form-check-input me-1" type="checkbox" name="opcoes[]" value="Falta de alimento">
            <label class="form-check-label ">Falta de alimento</label>
        </div>

        <div class="form-check card container px-5">
            <input class="form-check-input" type="checkbox" name="opcoes[]" value="Produto vencido">
            <label class="form-check-label">Produto vencido</label>
        </div>

        <div class="form-check card container px-5">
            <input class="form-check-input" type="checkbox" name="opcoes[]" value="Problema com equipamento">
            <label class="form-check-label">Problema com equipamento</label>
        </div>

        <div class="form-check card container px-5">
            <input class="form-check-input" type="checkbox" name="opcoes[]" value="Qualidade do alimento">
            <label class="form-check-label">Qualidade do alimento</label>
        </div>

        <div class="form-check mb-3 card container px-5">
            <input class="form-check-input" type="checkbox" name="opcoes[]" value="Outro">
            <label class="form-check-label">Outro</label>
        </div>

        <!-- Descrição -->
        <label class="form-label px-2">Descrição do Problema *</label>
        <textarea id="descricao" class="form-control mb-3 container px-3" rows="4" placeholder="Descreva o problema..."></textarea>

        <!-- Botões -->
        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" onclick="voltar()">Voltar</button>
            <button type="submit" class="btn btn-success">Enviar Reporte</button>
        </div>

        </form>

        <!-- Mensagem -->
        <div id="mensagem" class="mt-3"></div>

    </main>
    <script src="reportar_problema_script.js"></script>
</body>
</html>
