<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar Problema</title>
  <!-- Bootstap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="reportar_problema_M.css">
</head>

<body>
    <main class="container py-4">
        <section class="card-form mx-auto">
            <h1 class="text-center mb-2">Sistema Merenda Escolar</h1>
            <h4 class="text-center mb-4">Reportar Problema</h4>

            <form id="formProblema" >
            <!-- Tipo de problema -->
                <label class="form-label">Tipo de Problema *</label>

                <div class="form-check card-opcao">
                    <input class="form-check-input" type="checkbox" name="opcoes[]" value="Falta de alimento">
                    <label class="form-check-label">Falta de alimento</label>
                </div>

                <div class="form-check card-opcao">
                    <input class="form-check-input" type="checkbox" name="opcoes[]" value="Produto vencido">
                    <label class="form-check-label">Produto vencido</label>
                </div>

                <div class="form-check card-opcao">
                    <input class="form-check-input" type="checkbox" name="opcoes[]" value="Problema com equipamento">
                    <label class="form-check-label">Problema com equipamento</label>
                </div>

                <div class="form-check card-opcao">
                    <input class="form-check-input" type="checkbox" name="opcoes[]" value="Qualidade do alimento">
                    <label class="form-check-label">Qualidade do alimento</label>
                </div>

                <div class="form-check card-opcao">
                    <input id="checkOutro" class="form-check-input" type="checkbox" name="opcoes[]" value="Outro">
                    <label class="form-check-label">Outro</label>
                </div>

                <div id="campoOutro" class="mb-3 d-none">
                    <label class="form-label">Informe o outro problem *</label>
                    <input type="text" class="form-control" id="outroProblema" placeholder="Ex: Falta de gás">
                </div>

                <label class="form-label">Descrição do Problema</label>
                <textarea rows="4" id="descricao" class="form-control mb-3" placeholder="Descreva o problema com detalhes..."></textarea>

                <div class="d-flex justify-content-between gap-2">
                    <button type="button" class="btn btn-secondary" onclick="voltar()">Voltar</button>
                    <button type="submit" id="btnSubmit" class="btn btn-success">Enviar Reporte</button>
                </div>
                <div id="mensagem" class="mt-3"></div>
            </form>
        </section>

        <section class="card-form mx-auto mt-4">
            <h4 class="mb-3">Problemas Reportados</h4>
            <div id="listaReportes"></div>
        </section>
    </main>
    <script src="reportar_problema_script.js"></script>
</body>
</html>
